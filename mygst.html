  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
  button{font-family:var(--sans);cursor:pointer}
  input,select{font-family:var(--sans)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{width:236px;flex:0 0 236px;background:var(--dark);color:#EDEDED;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:20}
  .main{margin-left:236px;flex:1;min-width:0;position:relative;background-color:var(--bg);background-image:var(--doodles);background-size:440px;background-repeat:repeat}
  .content{max-width:980px;margin:0 auto;padding:36px 36px 80px}
  .view-pop{animation:pop .3s ease}
  @keyframes pop{from{transform:scale(.965);opacity:0}to{transform:scale(1);opacity:1}}
  .loader{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background-color:var(--bg);background-image:var(--doodles);background-size:440px;background-repeat:repeat;z-index:6;opacity:0;transition:opacity .18s;pointer-events:none}
  .loader.show{opacity:1;pointer-events:all}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader span{font-size:13px;color:var(--muted);font-weight:500}

  /* ---------- sidebar ---------- */
  .brand{padding:18px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .brand-row{display:flex;align-items:center;gap:11px}
  .logo{width:42px;height:42px;flex:0 0 42px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .brand h1{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff;letter-spacing:.2px;line-height:1.1}
  .brand h1 span{color:#7EE8A2}
  .brand p{font-size:11.5px;color:#A9C9C4;margin-top:2px}
  .side-toggle{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.28);color:#CFE4E0;width:32px;height:32px;flex:0 0 32px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s}
  .side-toggle:hover{border-color:var(--primary);color:#fff}
  .side-toggle svg{width:18px;height:18px}
  .nav-ico{flex:0 0 20px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .nav-ico svg{width:20px;height:20px;display:block}

  /* collapsed sidebar — icons only */
  .sidebar{transition:width .18s ease}
  .main{transition:margin-left .18s ease}
  body.collapsed .sidebar{width:68px;flex:0 0 68px}
  body.collapsed .main{margin-left:68px}
  body.collapsed .brand{padding:14px 9px 12px}
  body.collapsed .brand-row{flex-direction:column;gap:10px}
  body.collapsed .brand-txt{display:none}
  body.collapsed .logo{width:38px;height:38px}
  body.collapsed nav{padding:10px 9px}
  body.collapsed .nav-item{justify-content:center;padding:10px 0}
  body.collapsed .nav-item .label{display:none}
  body.collapsed .nav-dot{position:absolute;top:9px;right:9px;margin:0}
  body.collapsed .side-foot{display:none}
  nav{padding:14px 10px;overflow-y:auto;flex:1}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#CFE4E0;padding:10px 12px;border-radius:6px;text-align:left;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;text-decoration:none;position:relative}

  .nav-dot{width:7px;height:7px;border-radius:50%;background:#FF6B5E;margin-left:auto;flex:0 0 auto}
  .side-foot{padding:14px 22px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#9CA3AF}
  .side-btns{display:flex;gap:8px;margin-top:10px}
  .side-btn{background:none;border:1px solid rgba(255,255,255,.28);color:#CFE4E0;padding:4px 10px;border-radius:4px;font-size:11.5px;transition:border-color .15s,color .15s}
  .side-btn:hover{border-color:var(--primary);color:#fff}

  /* ---------- shared ---------- */
  .kicker{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
  h2.page{font-family:var(--serif);font-size:27px;font-weight:600;margin-bottom:6px}
  .lede{color:var(--muted);font-size:14.5px;max-width:640px;margin-bottom:26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px}
  .card h3{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:4px}
  .card .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  .grid{display:grid;gap:16px}
  .btn{background:var(--primary);color:#fff;border:1px solid var(--primary);padding:9px 18px;border-radius:4px;font-size:13.5px;font-weight:600;transition:background .15s}
  .btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn.ghost{background:#fff;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{background:#F3F4F6;border-color:#D1D5DB}
  .btn.xs{padding:4px 10px;font-size:12px}
  .btn:disabled{opacity:.55;cursor:default}
  .send-btn{width:42px;height:42px;flex:0 0 42px;border:none;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .send-btn:hover{background:var(--primary-dark)}
  .send-btn:active{transform:scale(.93)}
  .send-btn svg{width:18px;height:18px;display:block}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:3px}
  .pill.ok{background:var(--green-soft);color:var(--teal)}
  .pill.bad{background:var(--red-soft);color:var(--red)}
  .pill.warn{background:var(--gold-soft);color:#8a5a10}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  input.field,select.field{width:100%;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:13.5px;background:#fff;color:var(--text)}
  input.field:focus,select.field:focus{outline:2px solid rgba(37,211,102,.3);border-color:var(--primary)}
  label.f{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
  .footnote{font-size:12px;color:var(--muted);margin-top:12px}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;display:none}
  .err.show{display:block}
  .empty{font-size:13px;color:var(--muted);padding:14px 0;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 13px;font-size:12.5px;color:var(--text);transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--teal);background:var(--green-soft)}
  .chip.on{border-color:var(--teal);background:var(--green-soft);color:var(--teal);font-weight:600}

  /* ---------- overview ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px}
  .stat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stat .s{font-size:12px;margin-top:8px}
  .two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .qlist{list-style:none}
  .qlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .qlist li:last-child{border-bottom:none}
  .qlist .when{color:var(--muted);white-space:nowrap;font-size:12.5px;text-align:right}
  .linkbtn{border:none;background:none;color:var(--teal);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0;font-family:var(--sans)}
  .linkbtn:hover{color:var(--teal-dark)}

  /* ---------- deadlines ---------- */
  .dl{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
  .dl:last-child{border-bottom:none}
  .dl .days{flex:0 0 74px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 4px}
  .dl .days .n{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1}
  .dl .days .u{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .dl.soon .days{border-color:var(--red);background:var(--red-soft)}
  .dl.soon .days .n{color:var(--red)}
  .dl .what{flex:1}
  .dl .what b{font-size:14.5px;font-weight:600}
  .dl .what p{font-size:12.5px;color:var(--muted)}
  .setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .setrow:last-child{border-bottom:none}
  .setrow select{width:auto}
  .switch{position:relative;width:38px;height:21px;flex:0 0 38px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#D1D5DB;border-radius:21px;transition:.15s}
  .slider:before{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider:before{transform:translateX(17px)}

  /* ---------- checker ---------- */
  .check-row{display:flex;gap:10px;max-width:560px}
  .check-row input{letter-spacing:.06em;font-weight:600}
  #checkResult{margin-top:18px;max-width:640px}
  .verdict{display:flex;gap:14px;align-items:flex-start}
  .verdict .mark{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:600}
  .verdict.pass .mark{background:var(--green-soft);color:var(--teal)}
  .verdict.fail .mark{background:var(--red-soft);color:var(--red)}
  .facts{margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .facts div{background:#fff;padding:10px 12px;font-size:13px}
  .facts .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}

  /* ---------- quick help ---------- */
  .chat{max-width:680px}
  #chatLog{max-height:440px;overflow-y:auto;padding:6px 6px 6px 2px;margin-bottom:12px}
  .msg{display:flex;margin-bottom:14px}
  .msg.me{justify-content:flex-end}
  .bubble{max-width:78%;padding:11px 14px;border-radius:8px;font-size:13.5px}
  .msg.bot .bubble{background:#fff;border:1px solid var(--line);border-top-left-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
  .msg.me .bubble{background:var(--dark);color:#fff;border-top-right-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
  .bubble .src{display:block;margin-top:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9CA3AF;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .chips.suggest{margin:6px 0 16px}
  .askrow{display:flex;gap:10px}
  .askrow input{flex:1}

  /* ---------- easy entry ---------- */
  .drop{border:1.5px dashed #C9CDD3;border-radius:4px;background:#fff;padding:38px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover{border-color:var(--primary);background:var(--green-soft)}
  .drop b{font-family:var(--serif);font-size:16px;display:block;margin-bottom:4px;font-weight:600}
  .drop p{font-size:13px;color:var(--muted)}
  .reading{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--muted);font-size:14px}
  .receipt{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  .receipt .full{grid-column:1/-1}
  .saved{margin-top:14px;font-size:13px;color:var(--teal);background:var(--green-soft);border:1px solid #B9E6C6;padding:10px 14px;border-radius:4px}
  .or{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:12.5px}
  .or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- bill matcher ---------- */
  .banner{display:flex;align-items:center;gap:16px;background:var(--green-soft);border:1px solid #B9E6C6;border-radius:4px;padding:16px 20px;margin-bottom:20px}
  .banner.risky{background:var(--gold-soft);border-color:#EBD5AC}
  .banner.risky .big{color:var(--gold)}
  .banner.risky p{color:#7a5210}
  .banner .big{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--teal)}
  .banner p{font-size:13px;color:#0E5F46}
  .badge-ok,.badge-bad{font-size:11px;font-weight:700;padding:3px 9px;border-radius:3px;white-space:nowrap}
  .badge-ok{background:var(--green-soft);color:var(--teal)}
  .badge-bad{background:var(--red-soft);color:var(--red)}

  /* ---------- vendors ---------- */
  .vdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
  .vdot.ok{background:var(--primary)}
  .vdot.bad{background:var(--red)}
  .vrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .vrow .grow{flex:1;min-width:180px}

  /* ---------- rules timeline ---------- */
  .tl{border-left:2px solid var(--line);margin-left:8px;padding-left:24px;display:flex;flex-direction:column;gap:14px}
  .tl-item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
  .tl-item:last-child{padding-bottom:16px}
  .tl-item:before{content:"";position:absolute;left:-31px;top:18px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
  .tl-item.new:before{border-color:var(--primary);background:var(--primary)}
  .tl-item time{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tl-item h4{font-family:var(--serif);font-size:16px;font-weight:600;margin:3px 0 5px}
  .tl-item time{margin-bottom:0}
  .tl-item p{font-size:13.5px;color:#3f4650;max-width:640px}

  /* ---------- money tracker ---------- */
  .gapbar{height:14px;background:#EDEFF2;border-radius:3px;overflow:hidden;margin:10px 0 6px;position:relative}
  .gapbar .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
  .gapbar .fill.low{background:var(--gold)}
  .gapbar .fill.short{background:var(--red)}
  .gapbar .markline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
  .gaprow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  .warn{background:var(--gold-soft);border:1px solid #EBD5AC;border-radius:4px;padding:12px 16px;font-size:13.5px;margin-top:16px}
  .warn b{color:var(--gold)}
  .warn.ok{background:var(--green-soft);border-color:#B9E6C6}
  .warn.ok b{color:var(--teal)}
  .warn.bad{background:var(--red-soft);border-color:#E7C4BF}
  .warn.bad b{color:var(--red)}
  .pl td:first-child{color:#3f4650}
  .pl tr.total td{font-weight:700;border-top:2px solid var(--text);border-bottom:none}

  /* ---------- schemes ---------- */
  .scheme{display:flex;flex-direction:column;gap:6px}
  .scheme .tag{align-self:flex-start}
  .scheme p.reason{font-size:13.5px}
  .scheme .more{display:none;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .scheme.open .more{display:block}
  .scheme .learn{align-self:flex-start;background:none;border:none;color:var(--teal);font-size:13px;font-weight:600;padding:2px 0;text-decoration:underline;text-underline-offset:3px}

  /* ---------- toast + modal ---------- */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlay{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#fff;border:1px solid var(--line);border-radius:4px;max-width:380px;width:100%;padding:20px 22px}
  .modal h3{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:6px}
  .modal p{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .modal .mrow{display:flex;gap:10px;justify-content:flex-end}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    /* Sidebar stays a vertical left column on mobile, just narrower */
    .sidebar{width:172px;flex:0 0 172px}
    .main{margin-left:172px}
    .brand{padding:14px 12px 12px}
    .brand-row{gap:8px}
    .logo{width:34px;height:34px;flex:0 0 34px;border-radius:8px}
    .brand h1{font-size:17px}
    .brand p{display:none}
    nav{padding:10px 8px}
    .nav-item{padding:9px 9px;font-size:12px;line-height:1.25;white-space:normal}
    .side-foot{display:none}
    .content{padding:20px 14px 60px}
    .stats,.two,.facts{grid-template-columns:1fr}
    .receipt{grid-template-columns:1fr}
    .banner{flex-direction:column;align-items:flex-start}
    .main{background-size:420px}
    .check-row{flex-wrap:wrap}
    body.collapsed .sidebar{width:58px;flex:0 0 58px}
    body.collapsed .main{margin-left:58px}
    body.collapsed .logo{width:32px;height:32px}
    body.collapsed .side-toggle{width:28px;height:28px;flex:0 0 28px}
  }
  @media (max-width:420px){
    .sidebar{width:150px;flex:0 0 150px}
    .main{margin-left:150px}
    .nav-item{font-size:11.5px;padding:8px 7px}
    .brand h1{font-size:15px}
    .content{padding:16px 10px 60px}
    body.collapsed .sidebar{width:52px;flex:0 0 52px}
    body.collapsed .main{margin-left:52px}
    body.collapsed .logo{width:28px;height:28px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">

<script>
"use strict";

/* ============================================================
   Utilities
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const INR = new Intl.NumberFormat("en-IN");
const money = n => "\u20B9" + INR.format(Math.round(n));
const num = s => { const n = Number(String(s ?? "").replace(/[^0-9.]/g, "")); return isFinite(n) ? n : 0; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const daysLeft = d => Math.round((d - today()) / 864e5);
const fmtDate = d => d.toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" });
const uid = () => "x" + Math.random().toString(36).slice(2, 9);

let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

let modalCb = null;
function confirmBox(title, msg, onYes){
  modalCb = onYes;
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "overlay";
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">'
    + '<h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p>'
    + '<div class="mrow"><button class="btn ghost" data-action="modal-no">Cancel</button>'
    + '<button class="btn" data-action="modal-yes">Yes, continue</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if (e.target === ov) closeModal(); });
  $(".btn.ghost", ov).focus();
}
function closeModal(){ const ov = $("#overlay"); if (ov) ov.remove(); modalCb = null; }

/* ============================================================
   Real GSTIN logic: mod-36 check digit + state code lookup
   ============================================================ */
const GST_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const STATE_CODES = {
  "01":"Jammu & Kashmir","02":"Himachal Pradesh","03":"Punjab","04":"Chandigarh","05":"Uttarakhand",
  "06":"Haryana","07":"Delhi","08":"Rajasthan","09":"Uttar Pradesh","10":"Bihar","11":"Sikkim",
  "12":"Arunachal Pradesh","13":"Nagaland","14":"Manipur","15":"Mizoram","16":"Tripura","17":"Meghalaya",
  "18":"Assam","19":"West Bengal","20":"Jharkhand","21":"Odisha","22":"Chhattisgarh","23":"Madhya Pradesh",
  "24":"Gujarat","26":"Dadra & Nagar Haveli and Daman & Diu","27":"Maharashtra","29":"Karnataka",
  "30":"Goa","31":"Lakshadweep","32":"Kerala","33":"Tamil Nadu","34":"Puducherry","35":"Andaman & Nicobar Islands",
  "36":"Telangana","37":"Andhra Pradesh","38":"Ladakh","97":"Other Territory"
};
function gstinChecksumDigit(first14){
  let sum = 0;
  for (let i = 0; i < 14; i++){
    const factor = (i % 2 === 0) ? 1 : 2;
    const product = GST_CHARS.indexOf(first14[i]) * factor;
    sum += Math.floor(product / 36) + (product % 36);
  }
  return GST_CHARS[(36 - (sum % 36)) % 36];
}
function makeValidGstin(stateCode, pan5, entity){
  const body = stateCode + pan5 + entity + "Z";
  return body + gstinChecksumDigit(body);
}
function validateGstin(raw){
  const g = (raw || "").toUpperCase().replace(/\s+/g, "");
  if (!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$/.test(g))
    return { ok:false, why:"This does not look like a GSTIN. A GSTIN has 15 characters: 2-digit state code, 10-character PAN, entity number, the letter Z, and a check digit." };
  const state = STATE_CODES[g.slice(0,2)];
  if (!state) return { ok:false, why:"The first two digits (" + g.slice(0,2) + ") are not a valid state code." };
  const expect = gstinChecksumDigit(g.slice(0,14));
  if (g[14] !== expect) return { ok:false, why:"The check digit is wrong. The last character should be \u201C" + expect + "\u201D." };
  return { ok:true, state, pan:g.slice(2,12), entity:g[12], checkDigit:g[14] };
}

/* ============================================================
   Real due-date computation (monthly and quarterly GST cycles)
   ============================================================ */
function nextOccurrence(monthOffset, day){
  const now = today();
  let d = new Date(now.getFullYear(), now.getMonth() + monthOffset, day);
  while (d < now) d = new Date(d.getFullYear(), d.getMonth() + 1, day);
  return d;
}
function nextQuarterEnd18(){                       // CMP-08: 18th of month after quarter end
  const now = today();
  const q = Math.floor(now.getMonth() / 3) * 3;
  let d = new Date(now.getFullYear(), q + 3, 18);
  if (d < now) d = new Date(now.getFullYear(), q + 6, 18);
  return d;
}
function filingsWithDates(){
  return [
    { form:"GSTR-1",  short:"outward supplies statement", desc:"Outward supplies statement for this month.",            due:nextOccurrence(1,11) },
    { form:"GSTR-3B", short:"summary and payment",        desc:"Monthly summary return with tax payment.",              due:nextOccurrence(1,20) },
    { form:"CMP-08",  short:"quarterly tax payment",      desc:"Quarterly tax payment for the composition scheme.",     due:nextQuarterEnd18() }
  ].sort((a,b) => a.due - b.due);
}

const S = {
  filings: filingsWithDates,
  nextFiling(){ return this.filings()[0]; },
  vendorFlag(v){
    const check = validateGstin(v.gstin);
    if (!check.ok) return { flagged:true, why:"GSTIN fails the format or check digit test. Ask the vendor for the correct number." };
    const reasons = {
      ok:       null,
      unfiled:  "Has not filed GSTR-1 for 2 months. Your credit on their invoices is stuck.",
      amount:   "Filed amounts do not match your invoices. Possible billing problem.",
      cancelled:"GSTIN cancelled, retroactive. Stop claiming credit on their bills."
    };
    return v.base === "ok" ? { flagged:false, why:"Active with a clean filing record." } : { flagged:true, why:reasons[v.base] };
  },
  flaggedVendors(){ return state.vendors.filter(v => this.vendorFlag(v).flagged); },
  mismatched(){ return state.invoices.filter(i => i.status === "mismatch"); },
  atRisk(){ return this.mismatched().reduce((s,i) => s + i.tax, 0); },
  receiptsTax(){ return state.receipts.reduce((s,r) => s + (r.taxNum || 0), 0); },
  collected(){ return state.money.collectedBase; },
  owed(){ return Math.max(0, state.money.owedBase - this.receiptsTax()); },
  gap(){ return this.collected() - this.owed(); }
};

const FALLBACK = "I am not sure about that one. I only know a fixed set of topics for this demo: GSTR-1, GSTR-3B, input tax credit, late fees, nil filing, HSN codes, e-way bills, refunds, the composition scheme, and registration limits.\nTry rephrasing with one of those words, or ask a tax professional for anything beyond this list.";

MOUNT.help = () => {
  if (state.chat.length === 0){
    state.chat.push({ role:"bot", text:"Hello. Ask me any GST question — about filings, credit, late fees, or anything else on your mind.", src:null });
    save();
  }
  const log = $("#chatLog");
  state.chat.forEach(m => log.appendChild(makeMsg(m)));
  log.scrollTop = log.scrollHeight;
  const chips = ["When is GSTR-3B due?","What is input tax credit?","What happens if I file late?","Do I need a GST number?"];
  const c = $("#chips");
  chips.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = t;
    b.addEventListener("click", () => ask(t));
    c.appendChild(b);
  });
  const box = $("#askBox");
  box.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
  box.focus();
};
function makeMsg(m){
  const d = document.createElement("div");
  d.className = "msg " + (m.role === "me" ? "me" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = esc(m.text).replace(/\n/g, "<br>") + (m.src ? '<span class="src">From: ' + esc(m.src) + '</span>' : "");
  d.appendChild(b);
  return d;
}
function answerFor(q){
  const lower = q.toLowerCase();
  const words = lower.replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter(Boolean);
  let best = null, bestScore = 0;
  KB.forEach(e => {
    let score = 0;
    e.kw.forEach(k => {
      if (lower.includes(k)) score += k.includes(" ") ? 3 : 2;
      else k.split(/\s+/).forEach(part => { if (part.length > 2 && words.includes(part)) score += 1; });
    });
    if (score > bestScore){ bestScore = score; best = e; }
  });
  return best && bestScore >= 2 ? { a:best.a, src:best.topic } : { a:FALLBACK, src:null };
}
let asking = false;
function ask(preset){
  if (asking) return;
  const box = $("#askBox");
  const q = (preset !== undefined ? preset : (box ? box.value : "")).trim();
  if (!q) return;
  if (preset === undefined && box) box.value = "";
  state.chat.push({ role:"me", text:q });
  asking = true; $("#askBtn").disabled = true;
  const log = $("#chatLog");
  log.appendChild(makeMsg({ role:"me", text:q }));
  const t = document.createElement("div");
  t.className = "msg bot"; t.id = "typing";
  t.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  log.appendChild(t); log.scrollTop = log.scrollHeight;
  setTimeout(() => {
    const r = answerFor(q);
    state.chat.push({ role:"bot", text:r.a, src:r.src });
    if (state.chat.length > 60) state.chat = state.chat.slice(-60);
    save();
    const typing = $("#typing"); if (typing) typing.remove();
    log.appendChild(makeMsg({ role:"bot", text:r.a, src:r.src }));
    log.scrollTop = log.scrollHeight;
    asking = false; const btn = $("#askBtn"); if (btn) btn.disabled = false;
  }, 900 + Math.random() * 600);
}

function showManualForm(){
  if (entryPhase === "reading") return;
  entryPhase = "review"; entrySource = "manual"; entryDraft = manualDraft();
  const z = $("#entryZone"); if (z) z.innerHTML = entryZoneHTML();
  const first = $("#entryZone .field"); if (first) first.focus();

function confirmReceipt(){
  const rec = {};
  $$("#entryZone .field").forEach(i => rec[i.dataset.k] = i.value.trim());
  const errEl = $("#entryErr");
  const fail = msg => { if (errEl){ errEl.textContent = msg; errEl.classList.add("show"); } else toast(msg); };
  if (!rec.vendor){ fail("Add a vendor name before saving."); return; }
  if (!num(rec.amount)){ fail("Enter the total amount in rupees."); return; }
  if (rec.gstin){
    const chk = validateGstin(rec.gstin);
    if (!chk.ok){ fail(chk.why); return; }
  }
  if (num(rec.tax) > num(rec.amount)){ fail("GST charged cannot be more than the total amount."); return; }
  const amountNum = num(rec.amount), taxNum = num(rec.tax);
  state.receipts.unshift({ ...rec, amountNum, taxNum, savedAt:new Date().toISOString() });
  state.receiptCounter += 1;
  state.invoices.unshift({
    id:uid(), inv:rec.inv || "SPM/2026/0000", vendor:rec.vendor, gstin:rec.gstin || "",
    tax:taxNum, status:"mismatch", note:entrySource === "manual"
      ? "Entered by hand — vendor has not filed this one yet"
      : "New receipt — vendor has not filed this one yet"
  });
  save();
  entryPhase = "idle"; entryDraft = null;
  const z = $("#entryZone"); if (z) z.innerHTML = '<div class="saved">Saved. This receipt now feeds into Bill Matcher and Money Tracker.</div>';
  renderSaved();
  toast("Receipt saved. Tax owed reduced by " + money(taxNum));
}
function discardReceipt(){
  entryPhase = "idle"; entryDraft = null;
  const z = $("#entryZone"); if (z) z.innerHTML = entryZoneHTML();
  toast("Bill discarded");
}
function renderSaved(){
  const box = $("#savedList"); if (!box) return;
  if (state.receipts.length === 0){ box.innerHTML = '<p class="empty">Nothing saved yet. Scan a bill above to see it here.</p>'; return; }
  box.innerHTML = state.receipts.map(r =>
    '<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px">'

    + '<span style="color:var(--muted)">' + money(r.amountNum || 0) + '</span></div>').join("");
}

  $$("#view .chip[data-vfilter]").forEach(c => c.addEventListener("click", () => { vendorFilter = c.dataset.vfilter; rerender(); }));

function addVendor(){
  const nameEl = $("#vName"), gstinEl = $("#vGstin"), errEl = $("#vErr");
  const name = (nameEl.value || "").trim(), gstin = (gstinEl.value || "").trim().toUpperCase();
  errEl.classList.remove("show");
  if (!name){ errEl.textContent = "Please enter a vendor name."; errEl.classList.add("show"); return; }
  const r = validateGstin(gstin);
  if (!r.ok){ errEl.textContent = r.why; errEl.classList.add("show"); return; }
  state.vendors.unshift({ id:uid(), name, gstin, base:"ok" });
  save();
  toast(name + " added. Status: Safe.");
  rerender();
}
function removeVendor(id){
  const v = state.vendors.find(x => x.id === id);
  if (!v) return;
  state.vendors = state.vendors.filter(x => x.id !== id);
  save();
  toast(v.name + " removed from the watch list");
  rerender();
}

  <p class="lede">New GST rules and government updates, dated and explained without legal wording.</p>
  <div class="tl">` + RULES.map(r =>
    '<div class="tl-item' + (r.isNew ? " new" : "") + '"><time>' + r.d + (r.isNew ? " — New" : "") + '</time>'
    + '<h4>' + esc(r.t) + '</h4><p>' + esc(r.p) + '</p></div>').join("") + '</div>';

/* ============================================================
   Money Tracker — gap recomputed from receipts, status colour
   ============================================================ */
VIEWS.money = () => {
  const collected = S.collected(), owed = S.owed(), gap = S.gap();
  const threshold = Number(state.settings.warnUnder) || 10000;
  const pct = owed > 0 ? Math.round(collected / owed * 100) : 100;
  const fillCls = gap < 0 ? "short" : (gap < threshold ? "low" : "");
  const saved = state.receipts.reduce((s, r) => s + (r.taxNum || 0), 0);
  const purchases = state.money.purchasesBase + state.receipts.reduce((s, r) => s + (r.amountNum || 0), 0);
  const gross = state.money.sales - purchases;
  const net = gross - state.money.costs;
  const margin = state.money.sales > 0 ? (net / state.money.sales * 100).toFixed(1) : "0";
  let warn;
  if (gap < 0)
    warn = '<div class="warn bad"><b>Shortfall.</b> You have collected ' + money(Math.abs(gap)) + ' less than you owe. Set aside ' + money(owed) + ' before the 20th, or hold sales money aside as it comes in.</div>';
  else if (gap < threshold)
    warn = '<div class="warn"><b>Getting close.</b> The cushion of ' + money(gap) + ' is under your ' + money(threshold) + ' warning line. Avoid large payouts until the 20th.</div>';
  else
    warn = '<div class="warn ok"><b>On track.</b> You collected ' + money(gap) + ' more than you owe' + (saved > 0 ? ', including ' + money(saved) + ' of GST saved from your scanned receipts' : '') + '. Keep this cushion above the warning line.</div>';
  return head(MODULES[8], "Will the money be there on the 20th?") + `
  <p class="lede">The tax you collect from customers must cover the tax you owe. MyGST tracks that gap so a shortfall never surprises you.</p>
  <div class="grid two">
    <div class="card"><h3>Tax gap this month</h3><p class="sub">Collected from customers vs owed to the government.</p>
      <div class="gaprow"><span>Collected ${money(collected)}</span><span>Owed ${money(owed)}</span></div>
      <div class="gapbar"><div class="fill ${fillCls}" style="width:${Math.max(0, Math.min(pct, 100))}%"></div><div class="markline" style="left:100%"></div></div>
      <div class="gaprow"><span><b style="color:${gap < 0 ? "var(--red)" : gap < threshold ? "#8a5a10" : "var(--primary)"}">Gap: ${money(Math.abs(gap))} ${gap < 0 ? "short" : "safe"}</b></span><span>${pct}% collected</span></div>
      ${warn}
    </div>
    <div class="card"><h3>Set-aside rule</h3><p class="sub">A simple habit that prevents shortfalls. Settings are saved.</p>
      <div class="setrow"><span>Move GST collected into a separate account</span>
        <label class="switch"><input type="checkbox" data-setting="separateAccount" ${state.settings.separateAccount ? "checked" : ""}><span class="slider"></span></label></div>
      <div class="setrow"><span>Weekly nudge with the running gap</span>
        <label class="switch"><input type="checkbox" data-setting="weeklyNudge" ${state.settings.weeklyNudge ? "checked" : ""}><span class="slider"></span></label></div>
      <div class="setrow"><span>Warn me when the gap falls under</span>
        <select class="field" data-setting="warnUnder">
          <option value="10000" ${state.settings.warnUnder === "10000" ? "selected" : ""}>₹10,000</option>
          <option value="25000" ${state.settings.warnUnder === "25000" ? "selected" : ""}>₹25,000</option>
          <option value="50000" ${state.settings.warnUnder === "50000" ? "selected" : ""}>₹50,000</option>
        </select></div>
      <p class="footnote">Try it: raise the threshold above ${money(gap)} and the status turns amber.</p>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Profit and loss, this quarter</h3><p class="sub">Built from your sales, purchase records, and saved receipts.</p>
    <table class="pl"><tbody>
      <tr><td>Sales</td><td class="num">${money(state.money.sales)}</td></tr>
      <tr><td>Purchases${state.receipts.length ? " (includes " + money(purchases - state.money.purchasesBase) + " from scanned receipts)" : ""}</td><td class="num">${money(purchases)}</td></tr>
      <tr><td>Gross profit</td><td class="num">${money(gross)}</td></tr>
      <tr><td>Running costs (rent, salaries, other)</td><td class="num">${money(state.money.costs)}</td></tr>
      <tr class="total"><td>Net profit</td><td class="num">${money(net)}</td></tr>
    </tbody></table>
    <p class="footnote">Margin this quarter: ${margin}%. Last quarter: 12.1%.</p></div>`;
};

/* ============================================================
   Schemes For You — expandable eligibility cards
   ============================================================ */
const SCHEMES = [
  { t:"MSME Loan with Interest Subsidy", tag:"Finance", reason:"Your turnover of about ₹74 lakh fits the MSME band, so you get a 2% interest rebate on fresh working-capital loans.",
    more:"Apply through your bank with Udyam registration and your last GSTR-3B. Approval usually takes 2 to 3 weeks. Subsidy is credited yearly." },
  { t:"Composition Scheme (6% for services)", tag:"Simpler filing", reason:"With turnover under ₹50 lakh from services, you can file one small return per quarter instead of monthly returns.",
    more:"Trade-off: you cannot charge GST on invoices or claim input credit. Suits you if most buyers do not need a GST invoice." },
  { t:"Udyam Registration", tag:"Free registration", reason:"Free, fully online, and the gateway to most MSME benefits — delayed-payment protection, loans, and scheme priority.",
    more:"Takes about 10 minutes on the Udyam portal with just your Aadhaar and PAN. No documents are uploaded; details are pulled from government records." },
  { t:"Delayed Payment Protection (MSME Act)", tag:"Cash flow", reason:"As a registered MSME, buyers must pay you within 45 days or owe compound interest at 3 times the bank rate.",
    more:"File a claim on the MSME Samadhaan portal if a buyer delays. Keep invoices and delivery proof ready. Most cases settle without a hearing." },
  { t:"GeM Marketplace Onboarding", tag:"New sales", reason:"Government buyers purchase directly from MSMEs on GeM. Your trade category qualifies for reserved purchase orders.",
    more:"Registration is free with Udyam details. Start with small tenders; many are reserved so only MSMEs can bid." }
];
VIEWS.schemes = () => head(MODULES[9], "Help you can actually claim") + `
  <p class="lede">Based on your turnover and registration, these schemes look like a fit. Each card says why.</p>
  <div class="grid" style="grid-template-columns:1fr 1fr">` + SCHEMES.map(s =>
    '<div class="card scheme"><span class="pill warn tag">' + esc(s.tag) + '</span><h3>' + esc(s.t) + '</h3>'
    + '<p class="reason"><b>Why you qualify:</b> ' + esc(s.reason) + '</p>'
    + '<div class="more">' + esc(s.more) + '</div>'
    + '<button class="learn" data-action="toggle-scheme">Learn more</button></div>').join("") + '</div>';

/* ============================================================
   Settings persistence for every [data-setting] control
   ============================================================ */
document.addEventListener("change", e => {
  const el = e.target.closest("[data-setting]");
  if (!el) return;
  const k = el.dataset.setting;
  state.settings[k] = el.type === "checkbox" ? el.checked : el.value;
  save();
  toast("Setting saved");
});

/* ============================================================
   Boot
   ============================================================ */
current = currentRoute();
buildNav();
render();
</script>
</body>
</html>
